<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport — viewport-fit=cover for iPhone notch / Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme color (browser chrome) -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/robinos.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Admin PWA: standalone fullscreen, safe-area support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RobinOS" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DNS prefetch for Supabase (reduces latency on first API call) -->
    <link rel="dns-prefetch" href="https://iitfxyasjizlbneevwsa.supabase.co" />
    <!-- Preload Inter font subset for LCP improvement -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Primary SEO -->
    <title>RobinOS — AI Content Operating System for Creators</title>
    <meta name="description" content="RobinOS is an AI-powered content operating system for creators. Discover viral trends, generate scripts, find trending audio and hashtags, and create faster with AI." />

    <meta name="keywords" content="AI content creator tool, viral script generator, AI trend scanner, trending audio finder, hashtag discovery, TikTok script generator, Instagram Reels AI, YouTube Shorts script, creator AI tools, content operating system" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://tryrobin.xyz/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RobinOS" />
    <meta property="og:url" content="https://tryrobin.xyz/" />
    <meta property="og:title" content="RobinOS — AI Content Operating System for Creators" />
    <meta property="og:description" content="RobinOS is an AI-powered content operating system for creators. Discover viral trends, generate scripts, find trending audio and hashtags, and create faster with AI." />
    <meta property="og:image" content="https://tryrobin.xyz/robinos-logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="RobinOS — AI Content Operating System" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tryrobinos" />
    <meta name="twitter:title" content="RobinOS — AI Content Operating System for Creators" />
    <meta name="twitter:description" content="RobinOS is an AI-powered content operating system for creators. Discover viral trends, generate scripts, find trending audio and hashtags, and create faster with AI." />
    <meta name="twitter:image" content="https://tryrobin.xyz/robinos-logo.png" />
    <meta name="twitter:image:alt" content="RobinOS — AI Content Operating System" />

    <script type="application/ld+json">

      "url": "https://tryrobin.xyz/",

      "logo": "https://tryrobin.xyz/robinos-logo.png",
      "screenshot": "https://tryrobin.xyz/robinos-logo.png",
      "featureList": [
        "AI Trend Scanner",
        "Viral Script Generator",
        "Trending Audio Discovery",
        "Hashtag Intelligence",
        "AI Voice Studio",
        "AI Video Studio",
        "Caption Generator",
        "Creator Analytics"
      ],
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "0",
        "highPrice": "99",
        "priceCurrency": "USD",

      },
      "publisher": {
        "@type": "Organization",
        "name": "RobinOS",
        "url": "https://tryrobin.xyz/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://tryrobin.xyz/robinos-logo.png"
        },
        "contactPoint": {

        },
        "sameAs": [
          "https://tryrobin.xyz/"
        ]
      }

    <!-- Structured Data: WebSite (enables Google Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RobinOS",
      "url": "https://tryrobin.xyz/",
      "description": "AI Content Operating System for creators — trend scanning, script generation, audio discovery, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://tryrobin.xyz/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RobinOS",
      "url": "https://tryrobin.xyz/",

      "contactPoint": [
        {
          "@type": "ContactPoint",
          "email": "support@tryrobin.xyz",
          "contactType": "customer support",
          "availableLanguage": "English"
        }
      ],
      "sameAs": [
        "https://tryrobin.xyz/"
      ]
    }

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker registration — admin PWA shell caching -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .catch(function (err) { console.warn('[SW] Registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
